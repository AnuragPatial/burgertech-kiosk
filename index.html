    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Disable scrolling for kiosk feel, handle internally */
        overflow: hidden; 
        background-color: #f8f9fa;
        user-select: none; /* Prevent text selection like a real kiosk */
      }
      h1, h2, h3, h4, .kiosk-heading {
        font-family: 'Oswald', sans-serif;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .touch-action-manipulation {
        touch-action: manipulation;
      }
    </style>
